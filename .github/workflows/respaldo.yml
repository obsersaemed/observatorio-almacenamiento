# Respaldo diario de los datos publicados del observatorio (RF-13). Lee con la llave pública
# (solo lo aprobado), escribe respaldo/*.csv y hace commit si algo cambió. Correrlo a diario
# también mantiene activa la base del plan gratuito de Supabase (RNF-08).
# Secretos necesarios en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      = URL del proyecto (https://<ref>.supabase.co)
#   SUPABASE_ANON_KEY = llave pública (publishable / anon)
name: Respaldo diario

on:
  schedule:
    - cron: "0 11 * * *" # 06:00 en Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exportar datos publicados
        run: python scripts/respaldo.py --entorno env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add respaldo
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos publicados."
          else
            git commit -m "Respaldo diario de datos publicados ($(date -u +%Y-%m-%d))"
            git push
          fi
