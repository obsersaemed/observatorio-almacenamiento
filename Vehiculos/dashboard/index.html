<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacenamiento de energía en vehículos eléctricos — Observatorio TEJ</title>
<meta name="description" content="Vehículos eléctricos registrados en Colombia: ventas por marca, tecnologías de batería y energía almacenada en circulación.">
<link rel="stylesheet" href="ds/styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  a { color: var(--text-link); }
  a:hover { color: var(--text-link-hover); }
  select:focus-visible, button:focus-visible { outline: none; box-shadow: var(--ring); }
  /* Ajustes para movil sobre componentes del design system (que no los traen):
     el menu se desplaza en horizontal y el titulo se reduce para no desbordar. */
  header nav ul { overflow-x: auto; scrollbar-width: none; }
  header nav ul::-webkit-scrollbar { display: none; }
  header nav li { flex-shrink: 0; }
  #root > div { overflow-x: clip; }
  @media (max-width: 640px) {
    h1 { font-size: 30px !important; overflow-wrap: anywhere; }
  }
  #root:empty::after { content: "Cargando…"; display: block; padding: 48px; text-align: center; color: var(--text-muted); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="ds/_ds_bundle.js"></script>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
