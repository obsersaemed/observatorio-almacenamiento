<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-alt);font-family:var(--font-sans)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS=window['ObservatorioTEJDesignSystem_45c7be'];
const {Panel,BarChart,DonutChart,LineChart}=NS;
function Demo(){return <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:16,alignItems:'start'}}>
  <Panel title="Comparación MW vs MWh por proyecto">
    <BarChart categories={['Canadian solar','La Martina','BESS Termozipa','Celsia Palmira 2']}
      series={[{label:'Potencia nominal [MW]',color:'var(--series-1)',values:[50,9,7,1]},
               {label:'Capacidad máxima [MWh]',color:'var(--series-2)',values:[45,6.9,3.9,2]}]}/>
  </Panel>
  <Panel title="Tecnología"><DonutChart data={[{label:'Li-ion',value:100}]}/></Panel>
  <div style={{gridColumn:'1 / -1'}}>
    <Panel title="Potencia nominal [MW] vs FPO">
      <LineChart yLabel="Potencia nominal [MW]" points={[{x:'2019',y:50},{x:'2021',y:9},{x:'2024',y:7},{x:'2025',y:2}]}/>
    </Panel>
  </div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
