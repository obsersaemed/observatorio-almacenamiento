<!-- @dsCard group="Colors" viewport="700x150" name="Project status" subtitle="Map markers & table states: operación, construcción, planeado, suspendido" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:10px;border:1px solid var(--line-200);overflow:hidden;width:132px}.sw .chip{height:56px}.sw .meta{padding:7px 9px;font-size:11px;line-height:1.4}.sw .meta b{display:block;color:var(--ink-900);font-size:12px;font-weight:700}.sw .meta span{color:var(--ink-500);font-family:var(--font-data)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--status-op)"></div><div class="meta"><b>En operación</b><span>--status-op</span><span>#2e9b4e</span></div></div>
<div class="sw"><div class="chip" style="background:var(--status-con)"></div><div class="meta"><b>En construcción</b><span>--status-con</span><span>#ef9f2e</span></div></div>
<div class="sw"><div class="chip" style="background:var(--status-plan)"></div><div class="meta"><b>Planeado / otro</b><span>--status-plan</span><span>#9aa0a6</span></div></div>
<div class="sw"><div class="chip" style="background:var(--status-susp)"></div><div class="meta"><b>Suspendido</b><span>--status-susp</span><span>#e2413a</span></div></div>
</div></body></html>
