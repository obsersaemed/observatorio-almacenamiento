<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:10px;border:1px solid var(--line-200);overflow:hidden;width:132px}.sw .chip{height:56px}.sw .meta{padding:7px 9px;font-size:11px;line-height:1.4}.sw .meta b{display:block;color:var(--ink-900);font-size:12px;font-weight:700}.sw .meta span{color:var(--ink-500);font-family:var(--font-data)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--teal-50)"></div><div class="meta"><b>Gray 50</b><span>--teal-50</span><span>#f1f3f3</span></div></div>
<div class="sw"><div class="chip" style="background:var(--teal-100)"></div><div class="meta"><b>Gray 100</b><span>--teal-100</span><span>#e4e7e8</span></div></div>

<div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="meta"><b>Gray 400</b><span>--teal-400</span><span>#565d61</span></div></div>
<div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="meta"><b>Gray 600</b><span>--teal-600</span><span>#3f4548</span></div></div>
</div></body></html>
