<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:0;background:var(--surface)}.wrap{display:flex;height:220px}

.b{flex:1;background:var(--teal-300);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.b::before{content:"";position:absolute;inset:0;background:url("../assets/colombia-map-watermark.png") center/contain no-repeat;opacity:.32;mix-blend-mode:screen}
.b span{position:relative;color:#fff;font-family:var(--font-display);font-weight:800;letter-spacing:.05em}</style></head><body>
<div class="wrap"><div class="a"></div><div class="b"><span>SOBRE FONDO TEAL</span></div></div>
</body></html>
