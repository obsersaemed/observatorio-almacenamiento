<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & surfaces" subtitle="Ink for text, lines for borders, faint surfaces + map-outline watermark" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:10px;border:1px solid var(--line-200);overflow:hidden;width:132px}.sw .chip{height:56px}.sw .meta{padding:7px 9px;font-size:11px;line-height:1.4}.sw .meta b{display:block;color:var(--ink-900);font-size:12px;font-weight:700}.sw .meta span{color:var(--ink-500);font-family:var(--font-data)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><b>Ink 900</b><span>--ink-900</span><span>#2b2f31</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="meta"><b>Ink 700 body</b><span>--ink-700</span><span>#595f63</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><b>Ink 500</b><span>--ink-500</span><span>#7f868a</span></div></div>
<div class="sw"><div class="chip" style="background:var(--line-300)"></div><div class="meta"><b>Line 300</b><span>--line-300</span><span>#d9dee0</span></div></div>
<div class="sw"><div class="chip" style="background:var(--surface-alt)"></div><div class="meta"><b>Surface alt</b><span>--surface-alt</span><span>#f5f8f9</span></div></div>
<div class="sw"><div class="chip" style="background:var(--map-outline)"></div><div class="meta"><b>Map outline</b><span>--map-outline</span><span>#dfe6e6</span></div></div>
</div></body></html>
