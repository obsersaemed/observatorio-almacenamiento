<!-- @dsCard group="Colors" viewport="700x150" name="Secondary & accent" subtitle="Neutral gray = 2nd chart series; peach = warm accent from the PDF" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{border-radius:10px;border:1px solid var(--line-200);overflow:hidden;width:132px}.sw .chip{height:56px}.sw .meta{padding:7px 9px;font-size:11px;line-height:1.4}.sw .meta b{display:block;color:var(--ink-900);font-size:12px;font-weight:700}.sw .meta span{color:var(--ink-500);font-family:var(--font-data)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--purple-100)"></div><div class="meta"><b>Gray 100</b><span>--purple-100</span><span>#eceeef</span></div></div>
<div class="sw"><div class="chip" style="background:var(--purple-200)"></div><div class="meta"><b>Gray 200</b><span>--purple-200</span><span>#a6adb1</span></div></div>
<div class="sw"><div class="chip" style="background:var(--purple-400)"></div><div class="meta"><b>Gray 400</b><span>--purple-400</span><span>#6b7276</span></div></div>
<div class="sw"><div class="chip" style="background:var(--peach-200)"></div><div class="meta"><b>Peach 200</b><span>--peach-200</span><span>#f9d3b6</span></div></div>
<div class="sw"><div class="chip" style="background:var(--peach-300)"></div><div class="meta"><b>Peach 300</b><span>--peach-300</span><span>#f4b183</span></div></div>
<div class="sw"><div class="chip" style="background:var(--peach-400)"></div><div class="meta"><b>Peach 400</b><span>--peach-400</span><span>#e8935a</span></div></div>
</div></body></html>
