<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatorio de Almacenamiento de Energía</title>
  <link rel="stylesheet" href="assets/ds/styles.css">
  <style>
    body { margin: 0; background: var(--surface-alt, #f5f8f9); font-family: Raleway, Arial, sans-serif; }
    header { background: var(--surface-header); color: var(--brand-contrast); padding: 24px 16px; }
    header h1 { color: inherit; margin: 0 auto; max-width: 1100px; font-weight: 800; text-transform: uppercase; font-size: 1.4rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.seccion { display: block; background: #fff; border-radius: var(--radius-lg, 16px); padding: 20px;
                box-shadow: var(--shadow-card, 0 2px 10px rgba(27,50,54,.08)); color: inherit; text-decoration: none; }
    a.seccion h2 { margin: 0 0 8px; font-size: 1.1rem; }
    a.seccion p { margin: 0; }
  </style>
</head>
<body>
  <header><h1>Observatorio de Almacenamiento de Energía</h1></header>
  <!-- Esqueleto del MVP: cada sección vive en su carpeta y lee datos/*.csv publicados en sitio/datos/ -->
  <main>
    <a class="seccion" href="mapa/"><h2>Implementación en el país</h2><p>Mapa e inventario de SAEB en Colombia.</p></a>
    <a class="seccion" href="vehiculos/"><h2>Vehículos eléctricos</h2><p>Almacenamiento en la flota eléctrica.</p></a>
    <a class="seccion" href="normativa/"><h2>Evolución normativa</h2><p>CREG, MME y CNO, condensado y explicado.</p></a>
    <a class="seccion" href="noticias/"><h2>Noticias</h2><p>Novedades relevantes del almacenamiento.</p></a>
  </main>
</body>
</html>
